<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قشعاوي للاتصالات والإكسسوارات الذكية</title>
    
    <!-- مكتبة التنسيق والألوان السريعة (Tailwind CSS) لعودة الشكل الطبيعي -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- إعدادات تطبيق الويب PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="قشعاوي POS" />
    <style>
  [data-netlify-deploy-id],
  netlify-drawer,
  #netlify-drawer,
  .netlify-drawer,
  [class*="netlify-drawer"],
  div[style*="z-index: 2147483647"] {
    display: none !important;
    opacity: 0 !important;
    pointer-events: none !important;
    visibility: hidden !important;
  }
</style>
  </head>
  <body class="bg-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- تشغيل عامل الخدمة للعمل بدون إنترنت -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('PWA Service Worker يعمل بنجاح!'))
            .catch((err) => console.log('خطأ في تسجيل Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
